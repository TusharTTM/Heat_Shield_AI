name: Verify live Open-Meteo integration

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "shared/**"
      - ".github/workflows/verify-open-meteo.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional deployed app URL; leave empty to test the local Vite server"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  live-provider-and-browser:
    # Pin a Playwright-supported image while ubuntu-latest migrates to Ubuntu 26.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test real current, CAMS air-quality, five-day forecast, and historical API responses
        run: |
          set -o pipefail
          LIVE_OPEN_METEO=true npx vitest run src/test/live.openMeteo.test.ts | tee "$RUNNER_TEMP/live-api.txt"
      - name: Install Chromium for real-browser verification
        run: npx playwright install --with-deps chromium
      - name: Compare actual API responses with connected dashboard cards, multi-hazard views, and charts
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -o pipefail
          npm run test:live-ui | tee "$RUNNER_TEMP/live-ui.txt"
      - name: Expose failed browser output
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/live-ui.txt" <<'PY'
          from pathlib import Path
          import base64
          import sys
          path = Path(sys.argv[1])
          if path.exists():
              output = path.read_text(errors="replace")[-2400:]
              encoded = base64.b64encode(output.encode()).decode()
              print(f"::notice title=Browser verification failure base64::{encoded}")
          PY
      - name: Expose verified response evidence
        if: success()
        run: |
          while IFS= read -r evidence; do
            echo "::notice title=Real Open-Meteo API response::$evidence"
          done < <(grep -E '"live(OpenMeteo|AirQuality|Archive)"' "$RUNNER_TEMP/live-api.txt" | sed 's/^[^{]*//')
          while IFS= read -r evidence; do
            echo "::notice title=Real browser dashboard verification::$evidence"
          done < <(grep -E '^\{"liveBrowserVerified"' "$RUNNER_TEMP/live-ui.txt")
      - name: Publish verification output
        if: always()
        run: |
          {
            echo "## Open-Meteo & CAMS frontend verification output"
            for name in live-api live-ui; do
              if [ -f "$RUNNER_TEMP/$name.txt" ]; then
                echo "### $name"
                echo '```text'
                cat "$RUNNER_TEMP/$name.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  live-backend-and-official-sources:
    needs: live-provider-and-browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify live FastAPI Open-Meteo, CAMS, NDMA SACHET CAP, and CPCB state
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python - <<'PY' | tee "$RUNNER_TEMP/live-backend.json"
          import json
          import os
          import httpx
          from fastapi.testclient import TestClient
          from backend.app.config import Settings
          from backend.app.main import create_app
          from backend.app.models import ExternalDocumentCache, OfficialAlert
          from backend.app.regions import list_regions

          api_key = os.environ.get("DATA_GOV_IN_API_KEY", "").strip()
          settings = Settings(
              app_env="verification",
              database_url="sqlite:////tmp/heatshield-live-backend.db",
              weather_timeout_seconds=25,
              air_quality_timeout_seconds=25,
              sachet_enabled=True,
              sachet_timeout_seconds=25,
              sachet_max_cap_documents=150,
              data_gov_in_api_key=api_key,
              cpcb_timeout_seconds=20,
          )

          with TestClient(create_app(settings)) as client:
              regions = client.get("/api/v1/regions").json()
              assert len(regions) == 15

              # 1. Live Open-Meteo Weather + CAMS Air Quality on Mumbai and added city Bengaluru
              m_weather = client.get("/api/v1/weather/current/mumbai")
              assert m_weather.status_code == 200, m_weather.text
              m_forecast = client.get("/api/v1/weather/forecast/mumbai")
              assert m_forecast.status_code == 200 and len(m_forecast.json()["days"]) == 5
              m_aq = client.get("/api/v1/air-quality/current/mumbai")
              assert m_aq.status_code == 200 and m_aq.json()["is_station_observation"] is False
              m_aq_forecast = client.get("/api/v1/air-quality/forecast/mumbai")
              assert m_aq_forecast.status_code == 200 and len(m_aq_forecast.json()["hourly"]) >= 12
              m_risk = client.get("/api/v1/risk/mumbai")
              assert m_risk.status_code == 200
              m_aq_risk = client.get("/api/v1/risk/air-quality/mumbai")
              assert m_aq_risk.status_code == 200 and m_aq_risk.json()["is_station_observation"] is False

              b_weather = client.get("/api/v1/weather/current/bengaluru")
              assert b_weather.status_code == 200
              b_aq = client.get("/api/v1/air-quality/current/bengaluru")
              assert b_aq.status_code == 200

              # 2. Live NDMA SACHET CAP adapter smoke test
              sachet_resp = client.get("/api/v1/official/alerts/mumbai")
              if sachet_resp.status_code == 200:
                  s_body = sachet_resp.json()
                  assert s_body["evidence_type"] == "official-warning"
                  assert s_body["provider_status"] == "ok"
                  matches_by_region = {}
                  sample_alerts = []
                  for region in list_regions():
                      r_body = client.get(f"/api/v1/official/alerts/{region['slug']}").json()
                      matches_by_region[region["slug"]] = r_body["count"]
                      for item in r_body["alerts"][:2]:
                          if len(sample_alerts) < 5:
                              sample_alerts.append({
                                  "region": region["slug"],
                                  "identifier": item["identifier"],
                                  "sender": item["sender"],
                                  "event": item["event"],
                                  "severity": item["severity"],
                                  "match_type": item["match_type"],
                                  "expires": item["expires"],
                              })
                  with client.app.state.SessionLocal() as db:
                      docs = db.query(ExternalDocumentCache).all()
                      rss_docs = [d for d in docs if d.source == "sachet-rss"]
                      cap_docs = [d for d in docs if d.source == "sachet-cap"]
                      stored_alerts = db.query(OfficialAlert).count()
                      first_row = db.query(OfficialAlert).first()
                      sample_stored = None
                      if first_row:
                          sample_stored = {
                              "identifier": first_row.identifier,
                              "status": first_row.status,
                              "msgType": first_row.msg_type,
                              "scope": first_row.scope,
                              "event": first_row.event,
                              "sent": first_row.sent.isoformat() if first_row.sent else None,
                              "expires": first_row.expires.isoformat() if first_row.expires else None,
                              "areas": (first_row.areas or [])[:2],
                          }
                      rss_etag_present = bool(rss_docs and rss_docs[0].etag)
                      cap_etags_present = sum(1 for d in cap_docs if d.etag)
                  # Conditional revalidation pass
                  client.app.state.settings.sachet_cache_seconds = 0
                  reval = client.get("/api/v1/official/alerts/mumbai")
                  sachet_evidence = {
                      "liveSachetVerified": True,
                      "httpStatus": 200,
                      "retrievedAt": s_body["retrieved_at"],
                      "checkedAt": s_body["checked_at"],
                      "retrievalComplete": s_body["retrieval_complete"],
                      "activeMessagesEvaluated": s_body["active_messages_evaluated"],
                      "failedCount": s_body["failed_count"],
                      "invalidCount": s_body["invalid_count"],
                      "unresolvedAreaCount": s_body["unresolved_area_count"],
                      "validityIncompleteCount": s_body["validity_incomplete_count"],
                      "storedAlertRows": stored_alerts,
                      "cachedCapDocuments": len(cap_docs),
                      "rssEtagPresent": rss_etag_present,
                      "capEtagsPresent": cap_etags_present,
                      "revalidationHttpStatus": reval.status_code,
                      "matchesByRegion": matches_by_region,
                      "sampleAlerts": sample_alerts,
                      "sampleStoredAlert": sample_stored,
                  }
              else:
                  assert sachet_resp.status_code == 503
                  err = sachet_resp.json()
                  assert err.get("code", "").startswith("SACHET_")
                  probe = {}
                  try:
                      r = httpx.get(
                          settings.sachet_feed_url,
                          headers={"User-Agent": "HeatShieldAI/0.1 (+https://github.com/TusharTTM/Heat_Shield_AI)"},
                          timeout=15,
                          follow_redirects=False,
                      )
                      probe = {"upstreamStatus": r.status_code, "contentType": r.headers.get("Content-Type")}
                  except Exception as exc:
                      probe = {"upstreamException": type(exc).__name__}
                  sachet_evidence = {
                      "liveSachetVerified": False,
                      "failedClosed": True,
                      "fastapiStatus": sachet_resp.status_code,
                      "code": err.get("code"),
                      "probe": probe,
                  }

              # 3. CPCB / data.gov.in state (live if secret configured, explicit fail-closed otherwise)
              cpcb_resp = client.get("/api/v1/official/air-quality/current/mumbai")
              if api_key:
                  if cpcb_resp.status_code == 200:
                      c_body = cpcb_resp.json()
                      cpcb_evidence = {
                          "credentialConfigured": True,
                          "liveCpcbVerified": True,
                          "stationCount": c_body["count"],
                          "recordsRead": c_body["records_read"],
                          "retrievedAt": c_body["retrieved_at"],
                      }
                  else:
                      cpcb_evidence = {
                          "credentialConfigured": True,
                          "liveCpcbVerified": False,
                          "fastapiStatus": cpcb_resp.status_code,
                          "code": cpcb_resp.json().get("code"),
                      }
              else:
                  assert cpcb_resp.status_code == 503 and cpcb_resp.json()["code"] == "CPCB_NOT_CONFIGURED"
                  cpcb_evidence = {
                      "credentialConfigured": False,
                      "liveCpcbVerified": False,
                      "failedClosedCode": "CPCB_NOT_CONFIGURED",
                  }

              summary = {
                  "backendOpenMeteoVerified": True,
                  "regions": 15,
                  "mumbaiWeather": {
                      "observedAt": m_weather.json()["observed_at"],
                      "temperatureC": m_weather.json()["temperature_c"],
                      "heatIndexC": m_weather.json()["heat_index_c"],
                      "risk": m_risk.json()["level"],
                  },
                  "mumbaiAirQuality": {
                      "modelTime": m_aq.json()["model_time"],
                      "usAqi": m_aq.json()["us_aqi"],
                      "europeanAqi": m_aq.json()["european_aqi"],
                      "risk": m_aq_risk.json()["level"],
                      "forecastHours": len(m_aq_forecast.json()["hourly"]),
                  },
                  "bengaluruWeatherC": b_weather.json()["temperature_c"],
                  "bengaluruUsAqi": b_aq.json()["us_aqi"],
                  "sachet": sachet_evidence,
                  "cpcb": cpcb_evidence,
              }
              print(json.dumps(summary))
          PY
          echo "::notice title=Live backend & SACHET verification::$(cat "$RUNNER_TEMP/live-backend.json")"
          {
            echo "## Live Backend Open-Meteo, CAMS, SACHET & CPCB verification"
            echo '```json'
            python -m json.tool "$RUNNER_TEMP/live-backend.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
